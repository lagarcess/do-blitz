name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: do_blitz
          POSTGRES_PASSWORD: do_blitz
          POSTGRES_DB: do_blitz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U do_blitz -d do_blitz_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://do_blitz:do_blitz@localhost:5432/do_blitz_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Test
        run: python -m pytest -q
